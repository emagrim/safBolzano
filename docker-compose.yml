# Ambiente di sviluppo locale: WordPress + MariaDB + Mailpit (cattura le email).
# Avvio: docker compose up -d   ->  http://localhost:8080   (email: http://localhost:8025)
services:
  wordpress:
    image: wordpress:6-php8.2-apache
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/saf-bolzano:/var/www/html/wp-content/themes/saf-bolzano
      - ./wp-content/plugins/saf-bolzano-data:/var/www/html/wp-content/plugins/saf-bolzano-data
      - ./content:/var/www/html/wp-content/uploads/saf
      - ./docker/dev-mail.php:/var/www/html/wp-content/mu-plugins/dev-mail.php:ro

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    depends_on:
      - db
    user: "33:33"
    volumes_from:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress

volumes:
  wp_data:
  db_data:
